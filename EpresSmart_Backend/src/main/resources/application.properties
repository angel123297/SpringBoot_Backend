spring.application.name=EpresSmart

# ── MySQL ──────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/epresmart_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
# Evita el problema de lazy-loading fuera de sesion
spring.jpa.open-in-view=false

# ── Servidor ───────────────────────────────────────────────────────────────
server.port=8080

# ── Encoding UTF-8 ─────────────────────────────────────────────────────────
spring.mandatory-file-encoding=UTF-8
